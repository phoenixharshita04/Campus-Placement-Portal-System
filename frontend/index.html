<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Placement Portal</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <nav class="container">
        <a href="index.html" class="logo">PlacementConnect</a>
        <div class="nav-links">
            <a href="login.html" class="btn btn-outline" style="margin-left: 20px;">Log In</a>
            <a href="login.html?mode=register" class="btn btn-primary" style="margin-left: 10px;">Sign Up</a>
        </div>
    </nav>

    <main class="container" style="flex: 1; display: flex; align-items: center; justify-content: center; margin-top: 100px;">
        <div class="text-center glass-panel" style="padding: 60px; max-width: 800px; width: 100%;">
            <h1 style="font-size: 3rem; margin-bottom: 20px;">Your Dream Career Starts Here</h1>
            <p style="font-size: 1.2rem; margin-bottom: 40px; color: var(--text-secondary);">
                Connecting talented students with top companies. Seamless placement management for a brighter future.
            </p>
            <div>
                <a href="login.html?mode=register" class="btn btn-primary" style="font-size: 1.2rem; padding: 15px 30px;">Get Started</a>
            </div>
        </div>
    </main>

    <footer class="container text-center" style="padding: 20px 0; color: var(--text-secondary); margin-top: auto;">
        <p>&copy; 2026 PlacementConnect. All rights reserved.</p>
    </footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    <script>

        // Initialize 3D Tilt Effect on cards
        VanillaTilt.init(document.querySelectorAll(".glass-panel"), {
            max: 5,
            speed: 400,
            glare: true,
            "max-glare": 0.1,
        });

        // Parallax depth effect for main background elements
        document.addEventListener("mousemove", (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 90;
            const y = (window.innerHeight - e.pageY * 2) / 90;
            document.body.style.backgroundPosition = `${x}px ${y}px`;
        });
    </script>
</body>
</html>
