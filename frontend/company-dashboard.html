<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Dashboard - PlacementConnect</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --card-bg: rgba(255, 255, 255, 0.9);
            --danger-color: #ef4444;
            --success-color: #10b981;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #f6f8fd 0%, #f1f5f9 100%);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
        }

        .navbar {
            background: white;
            padding: 1rem 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        .btn {
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: flex;
            gap: 2rem;
        }

        .sidebar {
            width: 250px;
            padding: 20px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            align-self: start;
        }

        .sidebar-item {
            display: block;
            padding: 12px 16px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
            font-weight: 500;
            color: var(--text-muted);
        }

        .sidebar-item:hover, .sidebar-item.active {
            background-color: rgba(79, 70, 229, 0.1);
            color: var(--primary-color);
        }

        .main-content {
            flex: 1;
        }

        .section {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        h3 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .jobs-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .job-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 1.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .job-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .job-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary-color);
        }

        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            background: #e0e7ff;
            color: var(--primary-color);
        }

        .applications-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        .applications-table th, .applications-table td {
            text-align: left;
            padding: 0.75rem;
            border-bottom: 1px solid #e5e7eb;
        }
        .applications-table th {
            background: #f9fafb;
            font-weight: 600;
        }
        
        .status-select {
            padding: 0.25rem;
            border-radius: 4px;
            border: 1px solid #d1d5db;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="#" class="logo">PlacementConnect (Company)</a>
        <div>
            <span id="userNameDisplay" style="margin-right: 15px; font-weight: 500;"></span>
            <button class="btn btn-outline" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-item active" data-target="dashboardSection">Dashboard</div>
            <div class="sidebar-item" data-target="jobsSection">Manage Jobs</div>
            <div class="sidebar-item" data-target="applicantsSection">Applicants List</div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            
            <!-- Dashboard Section -->
            <div id="dashboardSection" class="section active">
                <div class="glass-card" style="margin-bottom: 2rem;">
                    <h3>Company Profile</h3>
                    <form id="profileForm">
                        <div class="form-group">
                            <label>Company Name</label>
                            <input type="text" id="companyName" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" id="companyEmail" class="form-control" readonly style="background-color: #f3f4f6;">
                        </div>
                        <div class="form-group">
                            <label>Contact Number</label>
                            <input type="text" id="contactNumber" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Website</label>
                            <input type="url" id="website" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Industry</label>
                            <input type="text" id="industry" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <textarea id="description" class="form-control" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%">Update Profile</button>
                    </form>
                </div>
            </div>

            <!-- Manage Jobs Section -->
            <div id="jobsSection" class="section">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                    <div class="glass-card">
                        <h3>Post a New Job</h3>
                        <form id="jobForm">
                            <div class="form-group">
                                <label>Job Title</label>
                                <input type="text" id="jobTitle" class="form-control" required>
                            </div>
                            <div style="display: flex; gap: 10px;">
                                <div class="form-group" style="flex: 1;">
                                    <label>Location</label>
                                    <input type="text" id="jobLocation" class="form-control" required>
                                </div>
                                <div class="form-group" style="flex: 1;">
                                    <label>Salary Package</label>
                                    <input type="text" id="jobSalary" class="form-control" placeholder="e.g. 12 LPA" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Job Description</label>
                                <textarea id="jobDescription" class="form-control" rows="3" required></textarea>
                            </div>
                            <div class="form-group">
                                <label>Required Skills</label>
                                <input type="text" id="jobSkills" class="form-control" placeholder="e.g. Java, Spring Boot">
                            </div>
                            <div style="display: flex; gap: 10px;">
                                <div class="form-group" style="flex: 1;">
                                    <label>Minimum CGPA Required</label>
                                    <input type="number" id="minCgpa" class="form-control" step="0.1" min="0" max="10" required>
                                </div>
                                <div class="form-group" style="flex: 1;">
                                    <label>Last Date to Apply</label>
                                    <input type="date" id="jobLastDate" class="form-control" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Other Eligibility Criteria</label>
                                <input type="text" id="jobEligibility" class="form-control" placeholder="e.g. Only CS/IT Branches">
                            </div>
                            <button type="submit" class="btn btn-primary" style="width: 100%">Post Job</button>
                        </form>
                    </div>

                    <div class="glass-card">
                        <h3>Our Job Postings</h3>
                        <div class="jobs-list" id="jobsList">
                            <!-- Jobs will be loaded here dynamically -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Applicants Section -->
            <div id="applicantsSection" class="section">
                <div class="glass-card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1rem;">
                        <h3 style="margin:0;" id="applicantsJobTitle">Job Applications</h3>
                    </div>
                    <table class="applications-table">
                        <thead>
                            <tr>
                                <th>Student Name</th>
                                <th>Roll No</th>
                                <th>Dept</th>
                                <th>CGPA</th>
                                <th>Applied Date</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="applicationsTableBody">
                            <tr><td colspan="7" style="text-align: center; color: var(--text-muted);">Select a job to view applicants.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>



    <!-- Modal for Edit Job -->
    <div id="editJobModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:100; align-items:center; justify-content:center;">
        <div class="glass-card" style="width: 500px; max-width: 90%;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1rem;">
                <h3 style="margin:0;">Edit Job</h3>
                <button onclick="closeEditJobModal()" class="btn btn-outline" style="padding:0.2rem 0.8rem;">Close</button>
            </div>
            <form id="editJobForm">
                <input type="hidden" id="editJobId">
                <div class="form-group">
                    <label>Job Title</label>
                    <input type="text" id="editJobTitle" class="form-control" required>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Location</label>
                        <input type="text" id="editJobLocation" class="form-control" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Salary Package</label>
                        <input type="text" id="editJobSalary" class="form-control" placeholder="e.g. 12 LPA" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Job Description</label>
                    <textarea id="editJobDescription" class="form-control" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label>Required Skills</label>
                    <input type="text" id="editJobSkills" class="form-control" placeholder="e.g. Java, Spring Boot">
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Minimum CGPA Required</label>
                        <input type="number" id="editMinCgpa" class="form-control" step="0.1" min="0" max="10" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Last Date to Apply</label>
                        <input type="date" id="editJobLastDate" class="form-control" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Other Eligibility Criteria</label>
                    <input type="text" id="editJobEligibility" class="form-control" placeholder="e.g. Only CS/IT Branches">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%">Update Job</button>
            </form>
        </div>
    </div>

    <script src="js/company-dashboard.js"></script>
</body>
</html>
